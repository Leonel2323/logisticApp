name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # lecture des fichiers modifiés (paths-filter)

jobs:
  changes:
    name: Détection des changements
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      ai: ${{ steps.filter.outputs.ai }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
            ai:
              - 'ai-service/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend (lint, tests, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  backend:
    name: Backend (tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      # Valeur de test uniquement (authService signe des JWT pendant les tests) : ce n'est pas un secret.
      JWT_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:coverage

  ai-service:
    name: AI service (syntaxe Python)
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11' # même version que le Dockerfile
      # Contrôle minimal tant que ai-service n'a ni tests ni configuration ruff.
      - run: python -m compileall -q app main.py
